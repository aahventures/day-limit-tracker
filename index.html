<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day Limit Tracker</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        max-width: fit-content;
        margin: 0 auto;
        padding: 12px 20px;
        background: #0d1117;
        color: #c9d1d9;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
      }
      .header h1 {
        margin: 0;
        font-size: 20px;
      }
      .header h1 span {
        color: #8b949e;
        font-weight: normal;
        font-size: 14px;
        margin-left: 8px;
      }
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      button,
      .file-label,
      select {
        background: #21262d;
        border: 1px solid #30363d;
        color: #c9d1d9;
        padding: 5px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
      }
      button:hover,
      .file-label:hover,
      select:hover {
        background: #30363d;
      }
      input[type='file'] {
        display: none;
      }
      input[type='number'] {
        background: #21262d;
        border: 1px solid #30363d;
        color: #c9d1d9;
        padding: 5px 8px;
        border-radius: 4px;
        font-size: 12px;
        width: 50px;
        text-align: center;
      }
      .input-sep {
        color: #8b949e;
        font-size: 12px;
      }
      .stats {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 10px 16px;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-evenly;
        flex-wrap: wrap;
        align-items: flex-start;
      }
      .stat {
        text-align: center;
        padding: 8px 12px;
      }
      .stat-value {
        font-size: 24px;
        font-weight: bold;
      }
      .stat-label {
        color: #8b949e;
        font-size: 11px;
      }
      .stat-value.warning {
        color: #f85149;
      }
      .stat-detail {
        color: #8b949e;
        font-size: 11px;
        margin-top: 4px;
      }
      .stat.worst-case {
        cursor: pointer;
        border-radius: 6px;
        transition: background 0.2s;
      }
      .stat.worst-case:hover,
      .stat.worst-case:focus {
        background: #21262d;
        outline: 2px solid #58a6ff;
        outline-offset: -2px;
      }
      .slider-container {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 10px 16px;
        margin-bottom: 12px;
      }
      .slider-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        font-size: 12px;
        color: #8b949e;
      }
      .slider-dates {
        color: #c9d1d9;
      }
      input[type='range'] {
        width: 100%;
        cursor: pointer;
      }
      .year-nav {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
      }
      .year-nav span {
        font-size: 14px;
        font-weight: 600;
        color: #c9d1d9;
      }
      .year-nav button {
        padding: 4px 10px;
        font-size: 14px;
      }
      .calendar-container {
        overflow-x: auto;
      }
      .year-label {
        font-size: 14px;
        font-weight: 600;
        margin: 12px 0 6px 0;
        color: #8b949e;
      }
      .year-label:first-child {
        margin-top: 0;
      }
      .calendar-wrapper {
        display: flex;
        gap: 3px;
      }
      .day-labels {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding-top: 17px; /* align with calendar (month label height + gap) */
      }
      .day-label {
        height: 12px;
        font-size: 9px;
        color: #8b949e;
        line-height: 12px;
        text-align: right;
        padding-right: 4px;
      }
      .calendar {
        display: flex;
        gap: 3px;
      }
      .month {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .month-label {
        font-size: 11px;
        color: #8b949e;
        height: 15px;
        text-align: center;
        border-radius: 3px;
        padding: 0 2px;
        cursor: pointer;
      }
      .month-label:focus {
        outline: 2px solid #58a6ff;
        outline-offset: 1px;
        color: #c9d1d9;
      }
      .weeks {
        display: flex;
        gap: 2px;
      }
      .week {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .day {
        width: 12px;
        height: 12px;
        background: #161b22;
        border-radius: 2px;
        cursor: pointer;
        border: 1px solid transparent;
        transition: all 0.1s;
      }
      .day:hover {
        border-color: #58a6ff;
      }
      .day:focus {
        outline: none;
        box-shadow: 0 0 0 2px #58a6ff;
        z-index: 1;
        position: relative;
      }
      .day.marked {
        background: #1f6feb;
      }
      .day.in-window {
        border-color: #f0883e;
      }
      .day.marked.in-window {
        background: #f0883e;
      }
      .day.today::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 4px;
        height: 4px;
        background: #f85149;
        border-radius: 50%;
      }
      .day.today {
        position: relative;
      }
      .legend {
        display: flex;
        gap: 12px;
        margin-top: 10px;
        font-size: 10px;
        color: #8b949e;
        flex-wrap: wrap;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .legend-box {
        width: 10px;
        height: 10px;
        border-radius: 2px;
      }
      .legend-box.home {
        background: #161b22;
      }
      .legend-box.marked {
        background: #1f6feb;
      }
      .legend-box.in-window {
        background: #161b22;
        border: 1px solid #f0883e;
      }
      .legend-box.marked-in-window {
        background: #f0883e;
      }
      .legend-box.today {
        background: #161b22;
        position: relative;
      }
      .legend-box.today::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 4px;
        height: 4px;
        background: #f85149;
        border-radius: 50%;
      }
      .tooltip {
        position: fixed;
        background: #21262d;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 12px;
        pointer-events: none;
        z-index: 1000;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Day Limit Tracker <span>Click to toggle days, Shift+click for range</span></h1>
      <div class="controls">
        <select id="presetSelect" aria-label="Configuration preset">
          <option value="custom">Custom</option>
          <option value="365/90" selected>365 days / 90 limit</option>
          <option value="180/90">Schengen (180/90)</option>
        </select>
        <input
          type="number"
          id="windowSizeInput"
          min="1"
          max="730"
          value="365"
          title="Window size (days)"
          aria-label="Window size in days"
        />
        <span class="input-sep">/</span>
        <input
          type="number"
          id="dayLimitInput"
          min="1"
          max="365"
          value="90"
          title="Day limit"
          aria-label="Day limit threshold"
        />
        <label class="file-label">
          <input type="file" id="fileInput" accept=".json" aria-label="Load dates from JSON file" />
          Load
        </label>
        <button id="exportBtn" aria-label="Export marked dates to JSON">Export</button>
        <button id="clearBtn" aria-label="Clear all marked dates">Clear</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="daysInWindow">0</div>
        <div class="stat-label">Marked (in window)</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="daysRemaining">90</div>
        <div class="stat-label" id="remainingLabel">Remaining (of 90)</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="totalDays">0</div>
        <div class="stat-label">Total marked</div>
      </div>
      <div
        class="stat worst-case"
        title="Click to jump to this window"
        role="button"
        tabindex="0"
        aria-label="Worst window - click to jump"
      >
        <div class="stat-value" id="maxDays">0</div>
        <div class="stat-label">Worst window</div>
        <div class="stat-detail" id="maxWindowDates"></div>
      </div>
    </div>

    <div class="slider-container">
      <div class="slider-label">
        <span id="windowLabel">365-day window:</span>
        <span class="slider-dates" id="windowDates"></span>
      </div>
      <input
        type="range"
        id="windowSlider"
        min="364"
        max="730"
        value="365"
        aria-label="Slide to adjust rolling window end date"
      />
    </div>

    <div class="year-nav" role="navigation" aria-label="Year navigation">
      <button id="prevYears" aria-label="Previous years">&larr;</button>
      <span id="yearRange"></span>
      <button id="nextYears" aria-label="Next years">&rarr;</button>
      <button id="todayBtn" aria-label="Jump to today">Today</button>
    </div>

    <div
      class="calendar-container"
      id="calendarContainer"
      role="application"
      aria-label="Calendar navigation: arrows to move, Enter to select, Escape to go back"
    ></div>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-box home"></div>
        Unmarked
      </div>
      <div class="legend-item">
        <div class="legend-box marked"></div>
        Marked
      </div>
      <div class="legend-item">
        <div class="legend-box in-window"></div>
        In window
      </div>
      <div class="legend-item">
        <div class="legend-box marked-in-window"></div>
        Marked (in window)
      </div>
      <div class="legend-item">
        <div class="legend-box today"></div>
        Today
      </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script src="app.js"></script>
  </body>
</html>
